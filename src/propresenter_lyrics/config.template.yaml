# ProPresenter-lyrics configuration
# ---------------------------------
# Edit values below and save. Sizes are in points. Colours are [R, G, B], 0-255.
# make_pro looks for this file as ./config.yaml, then
# ~/.config/propresenter-lyrics/config.yaml. Pass --config PATH to use another.

slide:
  width: 1920
  height: 1080

text_color: [255, 255, 255]        # main text colour (white)

stroke:                            # outline drawn around ALL text
  width: 6                         # 0 turns the outline off
  color: [0, 0, 0]                 # black

translation_gap: 70                # blank space (pt) between a lyric and its translation

margins:                           # keep text this far (px) from each slide edge
  left: 96
  right: 96
  top: 54                          # set to 0 to move the text box to the very top
  bottom: 54

vertical_align: middle             # where lyric text sits in the box: top | middle | bottom
                                   # use "top" to push lyrics up toward the top edge

# Fonts. ProPresenter can only show fonts installed on the computer that runs
# it; the fonts listed below come with every Mac.
fonts:
  chinese: PingFang SC             # all Chinese text (lyrics, translations, a Chinese title)
  # PingFang SC, PingFang SC Medium, PingFang SC Semibold,
  # PingFang TC, PingFang TC Medium, PingFang TC Semibold   (TC = Traditional)
  # Heiti SC, Heiti TC, Songti SC, Songti SC Bold, Songti TC, Songti TC Bold,
  # Hiragino Sans GB, Hiragino Sans GB W6
  latin: Helvetica Neue            # pinyin, Dutch/English text and the song title
  # Helvetica Neue, Helvetica Neue Medium, Helvetica Neue Bold,
  # Helvetica, Helvetica Bold, Arial, Arial Bold,
  # Avenir Next, Avenir Next Demi Bold, Avenir Next Bold, Futura, Gill Sans,
  # Optima, Georgia, Times New Roman, Verdana, Trebuchet MS
  # A font you installed yourself also works: use its exact name from Font Book.

# Sizes. When the MAIN lyric line is Chinese:
chinese:
  pinyin:                          # auto-generated PINYIN line, shown on top
    size: 65
  primary:                         # the Chinese lyric
    size: 120
  translation:                     # e.g. the Dutch translation, shown below
    size: 80

# When the MAIN lyric line is Dutch / English:
latin:
  primary:                         # the Dutch/English lyric
    size: 110
  translation:                     # the Chinese translation, shown below
    size: 95

# (Advanced: any line above can also set its own font, which then wins over
#  the fonts section, e.g.  pinyin: {size: 65, font: Futura-Medium, family: Futura})

# Song title (shown small in a corner of every slide)
title:
  size: 70
  align: right                     # left | center | right
  left_margin: 50
  right_margin: 110                # larger = title sits further from the edge
  bottom_margin: 20

markers:
  page_break: "//"                 # a line that is just // starts a new page
  line_break: "//"                 # // inside a line breaks it there
  translation_sep: "|｜∣│"          # any of these splits  lyric | translation
